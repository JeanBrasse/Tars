name: CI - Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Tars ships for macOS only, and the code stays portable: this keeps work done
  # on Windows from breaking there unseen. Not blocking yet: its first runs list
  # what fails on Windows, so that each failure is sorted (a test POSIX by
  # nature skips there, with its reason; a real defect goes to the Backend).
  # It becomes blocking once every remaining failure is understood.
  test-windows:
    name: Run Tests (Windows, measuring)
    runs-on: windows-latest
    continue-on-error: true
    # A test that hangs on Windows (run 2 sat silent for eight minutes) ends
    # the job instead of holding a runner for the six-hour default.
    timeout-minutes: 30

    steps:
      # Git for Windows checks text out with CRLF line endings; the tests read
      # fixtures and sources byte for byte, as they are on macOS and Linux.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # npm test runs the tars-relay plugin's own tests through Python 3.9 or
      # later; on Windows the runner's Python answers to python and py -3.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=default --reporter=json --outputFile=vitest-windows.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-windows
          path: vitest-windows.json
          if-no-files-found: warn
